<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 留言板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .login-container h1 {
            text-align: center;
            color: #00ffff;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ffff;
        }

        .tab-container {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #00ffff;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #00ffff;
            opacity: 0.6;
            transition: all 0.3s;
        }

        .tab.active {
            opacity: 1;
            border-bottom: 2px solid #00ffff;
        }

        .tab:hover {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ffff;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .password-input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #00ffff;
            opacity: 0.6;
            user-select: none;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ffff;
        }

        .btn:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #ff0040;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            text-shadow: 0 0 5px #ff0040;
        }

        .success-message {
            color: #00ff00;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            color: #00ffff;
            font-size: 14px;
        }

        .switch-link a {
            color: #00ffff;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="login-container">
        <h1>// 用户登录</h1>

        <div class="tab-container">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>

        <!-- 登录表单 -->
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">邮箱</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="login-password" required>
                    <span class="toggle-password" onclick="togglePassword('login-password')">👁</span>
                </div>
            </div>
            <button type="submit" class="btn">登录</button>
            <div id="login-error" class="error-message hidden"></div>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" class="hidden">
            <div class="form-group">
                <label for="register-email">邮箱</label>
                <input type="email" id="register-email" required>
            </div>
            <div class="form-group">
                <label for="register-password">密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="register-password" required minlength="6">
                    <span class="toggle-password" onclick="togglePassword('register-password')">👁</span>
                </div>
            </div>
            <div class="form-group">
                <label for="register-confirm-password">确认密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="register-confirm-password" required minlength="6">
                    <span class="toggle-password" onclick="togglePassword('register-confirm-password')">👁</span>
                </div>
            </div>
            <button type="submit" class="btn">注册</button>
            <div id="register-error" class="error-message hidden"></div>
            <div id="register-success" class="success-message hidden"></div>
        </form>
    </div>

    <script>
        // Matrix 背景动画
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Supabase 配置
        const SUPABASE_URL = '{{ supabase_url }}';
        const SUPABASE_ANON_KEY = '{{ supabase_anon_key }}';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Tab 切换
        const tabs = document.querySelectorAll('.tab');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                if (tab.dataset.tab === 'login') {
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                } else {
                    loginForm.classList.add('hidden');
                    registerForm.classList.remove('hidden');
                }
            });
        });

        // 密码显示/隐藏
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // 登录
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            errorDiv.classList.add('hidden');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorDiv.textContent = '邮箱或密码错误';
                errorDiv.classList.remove('hidden');
            } else {
                // 登录成功，跳转到主页
                window.location.href = '/';
            }
        });

        // 注册
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = '两次输入的密码不一致';
                errorDiv.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } else {
                successDiv.textContent = '注册成功！正在登录...';
                successDiv.classList.remove('hidden');

                // 自动登录
                const { error: loginError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (loginError) {
                    errorDiv.textContent = '注册成功，请手动登录';
                    errorDiv.classList.remove('hidden');
                } else {
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
