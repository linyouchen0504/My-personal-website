<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACE - Personal Site</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000000;
        text-align: center;
        font-family: 'Courier New', monospace;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* Matrix Canvas Background */
      #matrix-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Content overlay */
      .content-wrapper {
        position: relative;
        z-index: 1;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      h1 {
        color: rgb(240, 240, 255);
        text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 40px #00ff00;
        font-size: 3rem;
        letter-spacing: 8px;
        margin-bottom: 10px;
        font-family: 'Courier New', monospace;
      }

      h2 {
        color: #ff6600;
        text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300;
        margin-bottom: 30px;
        font-size: 1.4rem;
        min-height: 1.8em;
        letter-spacing: 2px;
      }

      h2 .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #ff6600;
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: blink 0.7s step-end infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      img {
        border-radius: 50%;
        border: 4px solid #00ff00;
        width: 300px;
        height: 300px;
        object-fit: cover;
        box-shadow: 0 0 30px #00ff00, 0 0 60px rgba(0, 255, 0, 0.3);
        cursor: pointer;
        transition: box-shadow 0.3s, transform 0.3s;
        margin-bottom: 30px;
      }

      img:hover {
        box-shadow: 0 0 50px #00ff00, 0 0 100px rgba(0, 255, 0, 0.5);
        transform: scale(1.05);
      }

      a {
        text-decoration: none;
        display: inline-block;
        margin: 8px 0;
      }

      @keyframes lrm {
        0% { transform: translateX(20px); }
        100% { transform: translateX(-20px); }
      }

      @keyframes glitch {
        0% { text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; }
        20% { text-shadow: -2px 0 #ff0000, 2px 0 #00ffff, 0 0 20px #00ff00; }
        40% { text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; }
        60% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff, 0 0 20px #00ff00; }
        80% { text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00; }
        100% { text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; }
      }

      @keyframes scanline {
        0% { top: -100%; }
        100% { top: 100%; }
      }

      a h3, a h4, a h5, a h6 {
        animation: lrm 1.5s ease-in-out infinite alternate, glitch 3s infinite;
        color: #00ff00;
        text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
        font-family: 'Courier New', monospace;
        padding: 10px 24px;
        border: 1px solid rgba(0, 255, 0, 0.3);
        border-radius: 4px;
        background: rgba(0, 255, 0, 0.05);
        transition: background 0.3s, box-shadow 0.3s;
        font-size: 1rem;
      }

      a h3:hover, a h4:hover, a h5:hover, a h6:hover {
        background: rgba(0, 255, 0, 0.15);
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.1);
      }

      /* Scanline overlay effect */
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 3px
        );
      }

      /* Moving scanline bar */
      .scanline-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(to bottom, transparent, rgba(0, 255, 0, 0.15), transparent);
        z-index: 3;
        pointer-events: none;
        animation: scanline 4s linear infinite;
      }

      .fake-alert {
        background-color: rgb(22, 21, 21);
        color: red;
        position: fixed;
        top: 50%;
        left: 50%;
        border: 2px solid red;
        box-shadow: 0 0 25px #ff3333;
        padding: 10px 20px;
        font-weight: bold;
        border-radius: 5px;
        transform: scale(0.1);
        opacity: 0;
        transition: all 0.5s;
        z-index: 10;
        font-family: 'Courier New', monospace;
      }

      /* ===== Cyberpunk Message Board ===== */

      /* Message list container */
      .msg-list {
        width: 100%;
        max-width: 520px;
        margin: 0 auto 24px auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg-item {
        background: rgba(0, 255, 255, 0.06);
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-left: 3px solid #00ffff;
        border-radius: 4px;
        padding: 10px 16px;
        color: #b0f0f0;
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        text-align: left;
        text-shadow: 0 0 4px rgba(0, 255, 255, 0.3);
        animation: msgFadeIn 0.6s ease-out both;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      .msg-item .msg-name {
        color: #00ffff;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(0, 255, 255, 0.5);
        margin-right: 8px;
      }

      .msg-item .msg-text {
        color: #c0e8e8;
      }

      @keyframes msgFadeIn {
        0% {
          opacity: 0;
          transform: translateY(12px) scale(0.97);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      /* Form container */
      .cyber-form {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        background: rgba(10, 10, 20, 0.75);
        border: 1px solid rgba(0, 255, 255, 0.4);
        border-radius: 6px;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow:
          0 0 15px rgba(0, 255, 255, 0.15),
          0 0 40px rgba(0, 255, 255, 0.05),
          inset 0 0 30px rgba(0, 255, 255, 0.03);
        position: relative;
        overflow: hidden;
      }

      .cyber-form::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #00ffff, transparent);
        animation: cyberScanline 3s linear infinite;
      }

      @keyframes cyberScanline {
        0% { left: -100%; }
        100% { left: 100%; }
      }

      .cyber-form input {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(0, 255, 255, 0.25);
        border-radius: 4px;
        padding: 10px 14px;
        color: #e0ffff;
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      .cyber-form input::placeholder {
        color: rgba(0, 255, 255, 0.35);
      }

      .cyber-form input:focus {
        border-color: #00ffff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.05);
      }

      .cyber-form button {
        background: transparent;
        border: 1px solid #00ffff;
        border-radius: 4px;
        padding: 10px 20px;
        color: #00ffff;
        font-family: 'Courier New', monospace;
        font-size: 0.95rem;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        text-shadow: 0 0 6px rgba(0, 255, 255, 0.5);
      }

      .cyber-form button:hover {
        background: rgba(0, 255, 255, 0.12);
        color: #ffffff;
        border-color: #00ffff;
        box-shadow:
          0 0 15px rgba(0, 255, 255, 0.5),
          0 0 40px rgba(0, 255, 255, 0.25),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
        text-shadow: 0 0 12px rgba(0, 255, 255, 0.9);
        transform: translateY(-1px);
      }

      .cyber-form button:active {
        transform: translateY(0);
        box-shadow:
          0 0 8px rgba(0, 255, 255, 0.4),
          inset 0 0 15px rgba(0, 255, 255, 0.15);
      }

      /* Section title for message board */
      .msg-title {
        color: #00ffff;
        font-family: 'Courier New', monospace;
        font-size: 1.1rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 16px;
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.6), 0 0 20px rgba(0, 255, 255, 0.3);
      }

      /* Error toast */
      .cyber-toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: rgba(10, 0, 0, 0.85);
        border: 1px solid #ff3333;
        border-radius: 4px;
        padding: 12px 28px;
        color: #ff4444;
        font-family: 'Courier New', monospace;
        font-size: 0.95rem;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(255, 50, 50, 0.7);
        box-shadow: 0 0 20px rgba(255, 50, 50, 0.3), inset 0 0 15px rgba(255, 50, 50, 0.05);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: toastIn 0.4s ease-out;
      }

      .cyber-toast.fade-out {
        animation: toastOut 0.6s ease-in forwards;
      }

      /* Info toast (cyan theme for download notifications) */
      .cyber-toast-info {
        background: rgba(0, 10, 10, 0.85);
        border: 1px solid #00ffff;
        color: #00ffff;
        text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.05);
      }

      @keyframes toastIn {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(-20px) scale(0.9);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes toastOut {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(1);
          filter: blur(0);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-20px) scale(0.9);
          filter: blur(4px);
        }
      }
    </style>

    <script>
      // ========== Typewriter Effect for Subtitle ==========
      (function () {
        var text = 'NB\u5230\u7206';
        var el = document.getElementById('typewriter-text');
        var charIndex = 0;
        var isDeleting = false;
        var typeSpeed = 150;
        var deleteSpeed = 100;
        var pauseAfterComplete = 1000;

        function typewrite() {
          if (!isDeleting) {
            // Typing phase
            charIndex++;
            el.textContent = text.substring(0, charIndex);
            if (charIndex === text.length) {
              // Finished typing, pause then start deleting
              isDeleting = true;
              setTimeout(typewrite, pauseAfterComplete);
              return;
            }
            setTimeout(typewrite, typeSpeed);
          } else {
            // Deleting phase
            charIndex--;
            el.textContent = text.substring(0, charIndex);
            if (charIndex === 0) {
              // Finished deleting, pause then start typing
              isDeleting = false;
              setTimeout(typewrite, 400);
              return;
            }
            setTimeout(typewrite, deleteSpeed);
          }
        }

        typewrite();
      })();

      // ========== Matrix Digital Rain Effect ==========
      (function () {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full screen
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Matrix characters (katakana + numbers + latin)
        const matrixChars = '0123456789';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        // Initialize drops
        function initDrops() {
          columns = Math.floor(canvas.width / fontSize);
          drops = new Array(columns).fill(0).map(function () {
            return Math.random() * -100;
          });
        }
        initDrops();
        window.addEventListener('resize', initDrops);

        function drawMatrix() {
          // Semi-transparent black to create fade trail effect
          ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.font = fontSize + 'px monospace';

          for (var i = 0; i < drops.length; i++) {
            var char = matrixChars[Math.floor(Math.random() * matrixChars.length)];

            // Bright head character
            var x = i * fontSize;
            var y = drops[i] * fontSize;

            // Head glow - bright white/green
            ctx.fillStyle = '#ffffff';
            ctx.fillText(char, x, y);

            // Trail character slightly above with green
            if (drops[i] > 1) {
              var trailChar = matrixChars[Math.floor(Math.random() * matrixChars.length)];
              ctx.fillStyle = '#00ff00';
              ctx.fillText(trailChar, x, y - fontSize);
            }

            // Move drop down
            drops[i]++;

            // Reset drop to top randomly after it goes off screen
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
              drops[i] = 0;
            }
          }

          requestAnimationFrame(drawMatrix);
        }

        drawMatrix();
      })();

      // ========== Original Fake Alert Function ==========
      function hca() {
        var n = 100;
        for (var i = 1; i <= n; i++) {
          setTimeout(function () {
            var box = document.createElement('div');
            box.innerText = '\u26a0\ufe0fACE\u672a\u6210\u529f\u62e6\u622a\u75c5\u6bd2\u26a0\ufe0f';
            document.body.appendChild(box);
            box.className = 'fake-alert';
            box.offsetHeight;
            box.style.left = Math.random() * 100 + '%';
            box.style.top = Math.random() * 100 + '%';
            box.style.transform = 'scale(' + (Math.random() + 0.5) + ') rotate(' + (Math.random() * 60 - 30) + 'deg)';
            box.style.opacity = '1';
          }, i * 20);
        }
      }

      // ========== Form Validation ==========
      (function () {
        var form = document.querySelector('.cyber-form');
        var toast = document.getElementById('error-toast');
        var isSubmitting = false;
        var toastTimer = null;
        var fadeTimer = null;
        
        if (form && toast) {
          form.addEventListener('submit', function (e) {
            // 防止重复提交
            if (isSubmitting) {
              e.preventDefault();
              return;
            }
            
            var nameInput = form.querySelector('input[name="name"]');
            var msgInput = form.querySelector('input[name="message"]');
            var submitBtn = form.querySelector('button[type="submit"]');
            
            var name = nameInput ? nameInput.value.trim() : '';
            var msg = msgInput ? msgInput.value.trim() : '';
            
            // 名字为空时自动填充"匿名用户"
            if (!name && nameInput) {
              nameInput.value = '匿名用户';
            }
            
            // 只有留言为空时才阻止提交
            if (!msg) {
              e.preventDefault();
              
              // 清除之前的定时器
              if (toastTimer) clearTimeout(toastTimer);
              if (fadeTimer) clearTimeout(fadeTimer);
              
              // 重置动画状态
              toast.classList.remove('fade-out');
              toast.style.display = 'block';
              toast.style.opacity = '1';
              
              // 4 秒后自动消失
              toastTimer = setTimeout(function () {
                toast.classList.add('fade-out');
                fadeTimer = setTimeout(function () {
                  toast.style.display = 'none';
                }, 600);
              }, 4000);
              return;
            }
            
            // 标记为正在提交，禁用按钮
            isSubmitting = true;
            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.style.opacity = '0.5';
              submitBtn.style.cursor = 'not-allowed';
              submitBtn.textContent = '[ 发送中... ]';
            }
          });
        }
      })();

      // ========== Download ACE Function ==========
      function downloadACE(e) {
        e.preventDefault();
        e.stopPropagation();
        var modal = document.getElementById('terms-modal');
        if (!modal) {
          alert('弹窗元素不存在');
          return false;
        }
        modal.style.display = 'flex';
        modal.style.opacity = '1';
        modal.style.visibility = 'visible';
        return false;
      }
      
      function closeModal() {
        var modalOverlay = document.getElementById('terms-modal');
        var modalContent = modalOverlay.querySelector('.cyber-modal');
        modalContent.classList.add('closing');
        setTimeout(function() {
          modalOverlay.style.display = 'none';
          modalContent.classList.remove('closing');
        }, 250);
      }
      
      function closeEggModal() {
        var modalOverlay = document.getElementById('egg-modal');
        var audio = document.getElementById('cyberpunk-music');
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
        var modalContent = modalOverlay.querySelector('.cyber-modal');
        modalContent.classList.add('closing');
        setTimeout(function() {
          modalOverlay.style.display = 'none';
          modalContent.classList.remove('closing');
        }, 250);
      }
      
      function rejectACE() {
        closeModal();
      }
      
      function agreeACE() {
        closeModal();
        
        var ua = navigator.userAgent.toLowerCase();
        var isWindows = ua.indexOf('win') !== -1;
        // 先检测 iOS 设备（iPhone、iPad、iPod），因为 iPadOS 13+ 的 Safari 使用桌面模式，UA 中包含 "mac"
        var isIOS = ua.indexOf('iphone') !== -1 || ua.indexOf('ipad') !== -1 || ua.indexOf('ipod') !== -1;
        var isMac = !isIOS && ua.indexOf('mac') !== -1;
        
        var toast = document.getElementById('download-toast');
        if (!toast) return;
        
        // 清除之前的定时器
        if (window.downloadToastTimer) clearTimeout(window.downloadToastTimer);
        if (window.downloadFadeTimer) clearTimeout(window.downloadFadeTimer);
        
        if (isWindows) {
          // Windows 用户直接下载
          window.location.href = 'https://down.anticheatexpert.com/docs/ACE-files/wsa/ACE_Keeper.zip';
        } else if (isMac) {
          // Mac 用户显示提示并下载
          toast.textContent = '// 请确保你的 Mac 在 M1 芯片及以上';
          toast.style.display = 'block';
          toast.classList.remove('fade-out');
          toast.style.opacity = '1';
          
          window.downloadToastTimer = setTimeout(function () {
            toast.classList.add('fade-out');
            window.downloadFadeTimer = setTimeout(function () {
              toast.style.display = 'none';
            }, 600);
          }, 4000);
          
          window.location.href = 'https://down.anticheatexpert.com/docs/ACE-files/wsa/ACEKeeper_1.0.0.10.dmg';
        } else {
          // 其他系统显示错误提示
          toast.textContent = '// 您的浏览器检测不到 UA 或 UA 不是 Windows 或 Mac';
          toast.style.display = 'block';
          toast.classList.remove('fade-out');
          toast.style.opacity = '1';
          
          window.downloadToastTimer = setTimeout(function () {
            toast.classList.add('fade-out');
            window.downloadFadeTimer = setTimeout(function () {
              toast.style.display = 'none';
            }, 600);
          }, 4000);
        }
      }
    </script>
